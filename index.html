                  }
                  .animate-float {
                    animation: float linear infinite;
                  }
                  .animate-fadeIn {
                    animation: fadeIn 0.3s ease-out;
                  }
                  .animate-slideUp {
                    animation: slideUp 0.4s ease-out;
                  }
                  .animate-flowUp {
                    animation: flowUp 8s ease-in-out infinite;
                  }
                  .animate-rotate {
                    animation: rotate 15s linear infinite;
                  }
                  .bg-gradient-radial {
                    background: radial-gradient(circle, var(--tw-gradient-stops));
                  }
                `}</style>
              </div>
            );
          }

          return (
            <div className="h-screen w-full bg-gradient-to-br from-sky-100 via-blue-50 to-pink-50 flex flex-col">
              <div className="bg-gradient-to-r from-pink-400 via-rose-300 to-orange-300 p-4 flex items-center justify-between shadow-lg">
                <div className="flex items-center gap-3">
                  <Waves className="w-8 h-8 text-white drop-shadow-md" />
                  <div>
                    <h1 className="text-2xl font-bold text-white drop-shadow-md" style={{fontFamily: 'Georgia, serif'}}>BreLes</h1>
                    <p className="text-xs text-white opacity-90">Your Elegant Assistant</p>
                  </div>
                </div>
                <button
                  onClick={returnToIdle}
                  className="px-4 py-2 bg-white bg-opacity-30 rounded-lg text-white hover:bg-opacity-40 transition shadow-md"
                >
                  Return
                </button>
              </div>

              <div className="flex-1 overflow-y-auto p-4 space-y-4">
                {messages.length === 0 && (
                  <div className="text-center text-gray-500 mt-20">
                    <MessageCircle className="w-16 h-16 mx-auto mb-4 opacity-50" />
                    <p className="text-xl">BreLes is ready to assist you, Mr. Nicholas</p>
                  </div>
                )}
                
                {messages.map((msg, idx) => (
                  <div
                    key={idx}
                    className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}
                  >
                    <div
                      className={`max-w-[80%] p-4 rounded-2xl shadow-md ${
                        msg.role === 'user'
                          ? 'bg-gradient-to-r from-blue-400 to-cyan-400 text-white'
                          : 'bg-white text-gray-800 border-2 border-pink-200'
                      }`}
                    >
                      {msg.content}
                    </div>
                  </div>
                ))}
                
                {isLoading && (
                  <div className="flex justify-start">
                    <div className="bg-white text-gray-800 p-4 rounded-2xl shadow-md border-2 border-pink-200">
                      <div className="flex gap-2">
                        <div className="w-2 h-2 bg-pink-400 rounded-full animate-bounce" />
                        <div className="w-2 h-2 bg-pink-400 rounded-full animate-bounce" style={{ animationDelay: '0.2s' }} />
                        <div className="w-2 h-2 bg-pink-400 rounded-full animate-bounce" style={{ animationDelay: '0.4s' }} />
                      </div>
                    </div>
                  </div>
                )}
                <div ref={messagesEndRef} />
              </div>

              <div className="p-4 bg-white border-t-2 border-pink-200 shadow-lg">
                <div className="flex gap-2">
                  <input
                    type="text"
                    value={input}
                    onChange={e => setInput(e.target.value)}
                    onKeyPress={e => e.key === 'Enter' && handleSendMessage()}
                    placeholder="Message BreLes..."
                    className="flex-1 px-4 py-3 bg-gray-50 text-gray-800 rounded-xl border-2 border-pink-200 focus:outline-none focus:border-pink-400"
                  />
                  <button
                    onClick={handleSendMessage}
                    disabled={isLoading || !input.trim()}
                    className="px-6 py-3 bg-gradient-to-r from-pink-400 to-rose-400 text-white rounded-xl font-semibold hover:opacity-90 disabled:opacity-50 transition shadow-md"
                  >
                    Send
                  </button>
                </div>
              </div>
            </div>
          );
        }

        ReactDOM.render(<BreLesAI />, document.getElementById('root'));
    </script>
